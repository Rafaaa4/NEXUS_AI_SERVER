server:
  port: 8083

grpc:
  server:
    port: 9090

spring:
  application:
    name: nexus-grpc-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus_ai}
    username: ${DB_USER:nexus}
    password: ${DB_PASS:nexus_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
