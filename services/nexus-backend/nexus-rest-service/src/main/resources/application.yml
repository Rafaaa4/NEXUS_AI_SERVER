server:
  port: 4000

spring:
  application:
    name: nexus-rest-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus_ai}
    username: ${DB_USER:nexus}
    password: ${DB_PASS:nexus_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_nexus_ai_dev_at_least_32_bytes_long}
  expiration-ms: 604800000 # 7 days
